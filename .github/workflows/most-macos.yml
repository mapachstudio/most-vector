# Compila Most Studio para macOS y publica el instalador.
#
# Escrito por Grupo MOST. NO llama a workflows de terceros: ver
# tools/flujo-macos.mjs en el repositorio de la suite para el porqué.
#
# No usa ningún secreto. La firma es ad-hoc, que sirve para comprobar que
# compila y para probar el .dmg en esta misma máquina; Gatekeeper lo
# rechazará en otros Macs hasta que se firme con la identidad de Apple.
name: Most Vector · macOS

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "universal, aarch64 o x86_64"
        default: universal
  push:
    branches: [most]

permissions:
  contents: read

jobs:
  instalador:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Sin rust-toolchain.toml en el repositorio: se pide estable y los dos
      # objetivos de Apple, porque el empaquetado universal los junta con lipo.
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version

      # Sin caché, cada compilación parte de cero: 40 minutos para saber si
      # un cambio de una línea compila. Se usa `actions/cache`, que es de
      # GitHub, en vez de la acción de caché de Rust que todo el mundo
      # emplea: una dependencia menos de un tercero en el camino que produce
      # el binario que vendemos.
      #
      # La clave lleva el Cargo.lock: si cambia una dependencia, caché nueva.
      # `restore-keys` deja reutilizar la anterior cuando solo cambia el
      # código nuestro, que es el caso normal.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Las pruebas del motor, antes de empaquetar.
      #
      # Hasta aquí este flujo solo compilaba, así que un cambio podía romper el
      # comportamiento sin que nada lo dijera: la compilación pasaba y el .dmg
      # salía igual. El proyecto original tiene una batería grande (su puerta es
      # `cargo xtask ci`), y correrla entera aquí costaría demasiado; la del
      # motor es donde vive la lógica de documentos y es la que cubre lo que
      # tocamos.
      #
      # En release: reaprovecha lo que el empaquetado va a compilar después, así
      # que lo que añade es el tiempo de las pruebas, no el de otra compilación.
      - name: Pruebas del motor
        # Acotado al módulo de entrada/salida de archivos. La bateria entera
        # del motor nunca se ha ejecutado en este entorno y puede tener fallos
        # ajenos a lo que cambiamos; una puerta que falla por motivos que no
        # son tuyos se acaba ignorando. Se amplia cuando se sepa que esta verde.
        run: cargo test --release -p vectorcraft-engine --lib -- cmd::fileio::tests

      - name: Empaquetar
        run: packaging/macos/package.sh --arch "${{ inputs.arch || 'universal' }}"

      # Antes de publicar nada: que el .dmg no lleve la marca ajena en el
      # nombre. Es la última línea de defensa del remarcado.
      - name: Comprobar el nombre del instalador
        run: |
          shopt -s nullglob
          for f in dist/release/*; do
            case "$(basename "$f")" in
              *vectorcraft*)
                echo "::error::el artefacto conserva la marca original: $f"; exit 1 ;;
            esac
          done
          ls -la dist/release/

      # Lo que se comprueba aquí es el PRODUCTO, no el código.
      #
      # Hoy aparecieron tres cosas que ninguna lectura del repositorio podía
      # ver: el actualizador ofrecía instalar el binario del proyecto
      # original encima del nuestro, el .app se distribuía sin la licencia
      # dentro, y el fondo del instalador llevaba la marca ajena. Las tres se
      # vieron abriendo el .dmg. Lo que se pueda automatizar de eso, se
      # automatiza: el resto no vuelve a depender de que alguien se acuerde.
      - name: Comprobar el instalador por dentro
        run: |
          set -euo pipefail
          dmg=$(ls dist/release/*.dmg | head -1)
          punto=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$punto" "$dmg"
          app=$(ls -d "$punto"/*.app)
          echo "==> $(basename "$app")"

          # Apache-2.0 §4: la licencia y el NOTICE viajan con la obra. Que
          # estén en el repositorio no es que estén en lo que baja el cliente.
          for f in NOTICE LICENSE-APACHE; do
            [[ -f "$app/Contents/Resources/$f" ]] \
              || { echo "::error::el .app se distribuye sin $f"; hdiutil detach "$punto" -quiet; exit 1; }
          done

          # Y ninguna marca ajena en lo que se instala ni en la ventana del
          # instalador (el .DS_Store guarda un alias con el nombre del volumen).
          #
          # Saltando los avisos de copyright y la atribución, que Apache-2.0
          # §4(c) obliga a CONSERVAR. Sin esa exclusión este mismo control
          # bloqueaba todas las compilaciones por el NSHumanReadableCopyright
          # del Info.plist, que nombra a los autores originales como manda
          # la licencia. Son dos obligaciones opuestas —quitar la marca como
          # identidad, conservar la atribución— y es fácil cumplir una
          # rompiendo la otra.
          for f in "$punto/.DS_Store" "$app/Contents/Info.plist"; do
            [[ -f "$f" ]] || continue
            if LC_ALL=C grep -av -e 'Copyright' -e '©' -e 'Obra original' -e 'Based on' "$f" \
               | LC_ALL=C grep -qa -e 'ArtCraft' -e 'VectorCraft'; then
              echo "::error::marca ajena dentro de $(basename "$f"), fuera de un aviso de copyright"
              hdiutil detach "$punto" -quiet; exit 1
            fi
          done

          ls -la "$app/Contents/Resources/" | head -12
          hdiutil detach "$punto" -quiet

      # El verificador del propio repositorio, sobre los artefactos tal como
      # se descargan. Sin credenciales de firma degrada a avisos, que es lo
      # que corresponde a una compilación ad-hoc.
      - name: Verificador del repositorio
        if: ${{ hashFiles('packaging/macos/verify.sh') != '' }}
        run: packaging/macos/verify.sh --arch "${{ inputs.arch || 'universal' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: most-vector-macos
          path: dist/release/*
          if-no-files-found: error

# Compila Most Studio para macOS y publica el instalador.
#
# Escrito por Grupo MOST. NO llama a workflows de terceros: ver
# tools/flujo-macos.mjs en el repositorio de la suite para el porqué.
#
# No usa ningún secreto. La firma es ad-hoc, que sirve para comprobar que
# compila y para probar el .dmg en esta misma máquina; Gatekeeper lo
# rechazará en otros Macs hasta que se firme con la identidad de Apple.
name: Most Vector · macOS

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "universal, aarch64 o x86_64"
        default: universal
  push:
    branches: [most]

permissions:
  contents: read

jobs:
  instalador:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Sin rust-toolchain.toml en el repositorio: se pide estable y los dos
      # objetivos de Apple, porque el empaquetado universal los junta con lipo.
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version

      # Sin caché, cada compilación parte de cero: 40 minutos para saber si
      # un cambio de una línea compila. Se usa `actions/cache`, que es de
      # GitHub, en vez de la acción de caché de Rust que todo el mundo
      # emplea: una dependencia menos de un tercero en el camino que produce
      # el binario que vendemos.
      #
      # La clave lleva el Cargo.lock: si cambia una dependencia, caché nueva.
      # `restore-keys` deja reutilizar la anterior cuando solo cambia el
      # código nuestro, que es el caso normal.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Empaquetar
        run: packaging/macos/package.sh --arch "${{ inputs.arch || 'universal' }}"

      # Antes de publicar nada: que el .dmg no lleve la marca ajena en el
      # nombre. Es la última línea de defensa del remarcado.
      - name: Comprobar el nombre del instalador
        run: |
          shopt -s nullglob
          for f in dist/release/*; do
            case "$(basename "$f")" in
              *vectorcraft*)
                echo "::error::el artefacto conserva la marca original: $f"; exit 1 ;;
            esac
          done
          ls -la dist/release/

      - uses: actions/upload-artifact@v4
        with:
          name: most-vector-macos
          path: dist/release/*
          if-no-files-found: error
